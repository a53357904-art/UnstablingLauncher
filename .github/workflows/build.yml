name: Build UnstablingLauncher

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Launcher
        run: dotnet publish UnstablingLauncher.csproj -c Release -r win-x64 --self-contained true

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create Installer
        run: iscc installer.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: UnstablingLauncher-Setup
          path: installer/UnstablingLauncher-Setup.exe
