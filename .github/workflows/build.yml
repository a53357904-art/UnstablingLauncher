name: Build UnstablingLauncher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build EXE
        run: dotnet publish UnstablingLauncher.csproj -c Release -r win-x64 --self-contained true

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UnstablingLauncher-Windows
          path: bin/Release/net8.0-windows/win-x64/publish/
