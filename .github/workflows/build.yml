name: Build UnstablingLauncher

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish launcher
        run: dotnet publish UnstablingLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer EXE
        run: iscc installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UnstablingLauncher-Setup
          path: installer/UnstablingLauncher-Setup.exe

